spring:
  application:
    name: collector
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        enabled: true
        max-attempts: 60
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
