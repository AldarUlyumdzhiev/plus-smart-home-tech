services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: >
      bash -c 'kafka-topics --create --topic telemetry.sensors.v1
               --partitions 1 --replication-factor 1 --if-not-exists
               --bootstrap-server kafka:29092 &&
               kafka-topics --create --topic telemetry.snapshots.v1
               --partitions 1 --replication-factor 1 --if-not-exists
               --bootstrap-server kafka:29092 &&
               kafka-topics --create --topic telemetry.hubs.v1
               --partitions 1 --replication-factor 1 --if-not-exists
               --bootstrap-server kafka:29092'
    init: true

  db:
    image: postgres:16.1
    container_name: smart-home-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_USER=user
      - POSTGRES_DB=smart

  discovery-server:
    image: springcloud/eureka
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_HOSTNAME: "discovery-server"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 2s
      retries: 20

  config-server:
    image: bitnami/spring-cloud-config-server:4
    container_name: config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: >
        file:/config/telemetry/{application},file:/config/commerce/{application}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_APPLICATION_NAME: config-server
    volumes:
      - ./infra/config-server/src/main/resources/config:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 2s
      retries: 20
